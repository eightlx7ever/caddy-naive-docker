
name: Build Caddy Naive Docker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-naive-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # 1. Checkout
      # -----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------
      # 2. 获取 forwardproxy 最新 Release
      # -----------------------------------------------
      - name: Get latest official release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/klzgrad/forwardproxy/releases/latest"

          RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API")

          TAG=$(echo "$RELEASE" | jq -r '.tag_name // empty')

          ASSET=$(echo "$RELEASE" | jq -r \
            '.assets[] |
             select(.name == "caddy-forwardproxy-naive.tar.xz") |
             .browser_download_url' | head -n 1)

          DIGEST=$(echo "$RELEASE" | jq -r \
            '.assets[] |
             select(.name == "caddy-forwardproxy-naive.tar.xz") |
             .digest' | head -n 1)

          if [[ -z "$TAG" ]]; then
            echo "Release tag not found"
            exit 1
          fi

          if [[ -z "$ASSET" || "$ASSET" == "null" ]]; then
            echo "Official Caddy binary not found"
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Valid SHA256 digest unavailable"
            echo "Refusing to download an unverified binary"
            exit 1
          fi

          echo "Official Release: $TAG"
          echo "Asset: $ASSET"
          echo "Digest: $DIGEST"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------
      # 3. 设置 GHCR 镜像名称
      # -----------------------------------------------
      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caddy-naive"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------
      # 4. 设置 Docker Buildx
      # -----------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------
      # 5. 登录 GHCR
      # -----------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------
      # 6. 检查 GHCR 是否已经存在该版本
      # -----------------------------------------------
      - name: Check whether version image already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_NAME: caddy-naive
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"

          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            API="https://api.github.com/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          else
            API="https://api.github.com/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          fi

          PAGE=1
          FOUND=false

          while true; do
            URL="${API}?per_page=100&page=${PAGE}"

            HTTP_CODE=$(curl -sS \
              --retry 3 \
              --retry-delay 2 \
              -o versions.json \
              -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL")

            # 包尚未创建：首次构建
            if [[ "$HTTP_CODE" == "404" && "$PAGE" == "1" ]]; then
              echo "GHCR package does not exist yet."
              break
            fi

            # 其他非 200 状态不能当成版本不存在
            if [[ "$HTTP_CODE" != "200" ]]; then
              echo "Failed to query GHCR package versions."
              echo "HTTP status: $HTTP_CODE"
              cat versions.json
              exit 1
            fi

            # 检查当前页面中的所有镜像标签
            if jq -e --arg TAG "$TAG" \
              '[.[].metadata.container.tags[]?] | index($TAG) != null' \
              versions.json >/dev/null; then

              FOUND=true
              break
            fi

            COUNT=$(jq 'length' versions.json)

            # 不足 100 条，说明已经到最后一页
            if [[ "$COUNT" -lt 100 ]]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          if [[ "$FOUND" == "true" ]]; then
            echo "Version already exists: $TAG"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version does not exist: $TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------
      # 7. 下载官方 Caddy-Naive 二进制
      #    只有版本不存在时才执行
      # -----------------------------------------------
      - name: Download official Caddy binary
        if: steps.check.outputs.exists != 'true'
        shell: bash
        env:
          ASSET: ${{ steps.release.outputs.asset }}
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "$ASSET" \
            -o caddy.tar.xz

          EXPECTED="${DIGEST#sha256:}"

          echo "$EXPECTED  caddy.tar.xz" | sha256sum -c -

          mkdir -p extracted

          tar -xJf caddy.tar.xz -C extracted

          CADDY=$(find extracted -type f -name caddy -print -quit)

          if [[ -z "$CADDY" ]]; then
            echo "Caddy binary not found in archive"
            exit 1
          fi

          cp "$CADDY" ./caddy
          chmod 755 ./caddy

          # 检查二进制架构
          file ./caddy

          if ! file ./caddy | grep -q "x86-64"; then
            echo "Unsupported architecture"
            echo "This workflow currently supports linux/amd64 only"
            exit 1
          fi

          # 检查 Caddy 版本
          ./caddy version

          # 检查 forwardproxy 插件
          ./caddy list-modules |
            grep -Fx "http.handlers.forward_proxy"

      # -----------------------------------------------
      # 8. 构建并推送 GHCR
      #    只有版本不存在时才执行
      # -----------------------------------------------
      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      # -----------------------------------------------
      # 9. 输出结果
      # -----------------------------------------------
      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          EXISTS: ${{ steps.check.outputs.exists }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$EXISTS" == "true" ]]; then
            echo "## Build skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Version $TAG already exists in GHCR." >> "$GITHUB_STEP_SUMMARY"
            echo "No download or build was performed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Build successful" >> "$GITHUB_STEP_SUMMARY"
            echo "Published: $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
            echo "Published: $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          fi
