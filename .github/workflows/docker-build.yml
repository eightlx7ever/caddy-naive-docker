
name: Build Caddy Naive Docker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-naive-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest official release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/klzgrad/forwardproxy/releases/latest"

          RELEASE=$(curl -fsSL "$API")

          TAG=$(echo "$RELEASE" | jq -r '.tag_name')

          ASSET=$(echo "$RELEASE" | jq -r \
            '.assets[] |
            select(.name == "caddy-forwardproxy-naive.tar.xz") |
            .browser_download_url')

          DIGEST=$(echo "$RELEASE" | jq -r \
            '.assets[] |
            select(.name == "caddy-forwardproxy-naive.tar.xz") |
            .digest')

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "Release tag not found"
            exit 1
          fi

          if [[ -z "$ASSET" || "$ASSET" == "null" ]]; then
            echo "Official Caddy binary not found"
            exit 1
          fi

          if [[ -z "$DIGEST" || "$DIGEST" == "null" ]]; then
            echo "SHA256 digest unavailable, refusing unverified binary"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download official Caddy binary
        shell: bash
        env:
          ASSET: ${{ steps.release.outputs.asset }}
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail

          curl -fL "$ASSET" -o caddy.tar.xz

          EXPECTED="${DIGEST#sha256:}"

          echo "$EXPECTED  caddy.tar.xz" | sha256sum -c -

          mkdir -p extracted

          tar -xJf caddy.tar.xz -C extracted

          CADDY=$(find extracted -type f -name caddy | head -n 1)

          if [[ -z "$CADDY" ]]; then
            echo "Caddy binary not found"
            exit 1
          fi

          cp "$CADDY" ./caddy
          chmod 755 ./caddy

          file ./caddy

          if ! file ./caddy | grep -q "x86-64"; then
            echo "This workflow currently supports linux/amd64 only"
            exit 1
          fi

          ./caddy version

          ./caddy list-modules |
            grep -Fx "http.handlers.forward_proxy"

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caddy-naive" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
