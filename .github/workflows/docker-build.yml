
name: Build Caddy NaiveProxy Docker Image

on:
  workflow_dispatch:

  # 每周一 UTC 03:00 检查官方更新
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取本仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 获取官方 Caddy 最新稳定版本
      - name: Get latest Caddy version
        id: caddy
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | jq -r '.tag_name')

          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Caddy version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Caddy version: $VERSION"

      # 3. 获取 forwardproxy naive 分支最新 Commit
      - name: Get forwardproxy commit
        id: forwardproxy
        shell: bash
        run: |
          set -euo pipefail

          COMMIT=$(git ls-remote \
            https://github.com/klzgrad/forwardproxy.git \
            refs/heads/naive | awk '{print $1}')

          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid forwardproxy commit: $COMMIT"
            exit 1
          fi

          SHORT_COMMIT="${COMMIT:0:12}"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"

          echo "forwardproxy commit: $COMMIT"

      # 4. 生成镜像名称
      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" \
            | tr '[:upper:]' '[:lower:]')

          echo "name=ghcr.io/${OWNER}/caddy-naive" \
            >> "$GITHUB_OUTPUT"

      # 5. 设置 QEMU，支持 ARM64 构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 6. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. AMD64 构建并测试
      - name: Build and test AMD64 image
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --load \
            --build-arg CADDY_VERSION=${{ steps.caddy.outputs.version }} \
            --build-arg FORWARDPROXY_COMMIT=${{ steps.forwardproxy.outputs.commit }} \
            -t caddy-naive:test \
            .

          echo "Checking Caddy version..."
          docker run --rm caddy-naive:test version

          echo "Checking forward_proxy module..."
          docker run --rm caddy-naive:test list-modules \
            | grep -Fx "http.handlers.forward_proxy"

      # 8. 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. 构建并推送 AMD64 / ARM64
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true

          build-args: |
            CADDY_VERSION=${{ steps.caddy.outputs.version }}
            FORWARDPROXY_COMMIT=${{ steps.forwardproxy.outputs.commit }}

          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:caddy-${{ steps.caddy.outputs.version }}-fp-${{ steps.forwardproxy.outputs.short }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Caddy with klzgrad forwardproxy naive fork
            org.opencontainers.image.version=${{ steps.caddy.outputs.version }}
            org.opencontainers.image.revision=${{ steps.forwardproxy.outputs.commit }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
